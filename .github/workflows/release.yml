name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Read release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          # Every language goes into one body. The app shows only the part after its own
          # `<!-- lang:xx -->` marker; GitHub shows them all, each under its heading.
          body=""
          for entry in "vi:CHANGELOG.md:Tiếng Việt" "en:CHANGELOG.en.md:English" "zh:CHANGELOG.zh.md:简体中文" "ja:CHANGELOG.ja.md:日本語"; do
            IFS=: read -r lang file title <<< "$entry"
            notes=$(awk -v v="$version" '
              /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
              found' "$file")
            if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
              echo "::error::$file has no entry for $version"
              exit 1
            fi
            printf -v section '<!-- lang:%s -->\n## %s\n%s\n\n' "$lang" "$title" "$notes"
            body+=$section
          done
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "KamiPanda v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
