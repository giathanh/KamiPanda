name: Homebrew

# Release builds are drafts; the tap is bumped once the release is published,
# when its assets become publicly downloadable.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (e.g. v1.5.0)"
        required: true

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."

      - uses: actions/checkout@v5
        if: env.HOMEBREW_TAP_TOKEN != ''

      - uses: actions/checkout@v5
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: giathanh/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          version="${TAG#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/KamiPanda_${version}_universal.dmg"
          sha256=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)

          mkdir -p tap/Casks
          sed -e "s/^  version \".*\"/  version \"${version}\"/" \
              -e "s/^  sha256 \".*\"/  sha256 \"${sha256}\"/" \
              homebrew/Casks/kamipanda.rb > tap/Casks/kamipanda.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kamipanda.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${version}"
          else
            git commit -m "kamipanda ${version}"
            git push
          fi
